name: ci

on:
  push:
  pull_request:

jobs:
  zig-0_16:
    strategy:
     fail-fast: false
     matrix:
       include:
        - zig: "0.16.0"
          os: ubuntu-latest
        - zig: "0.16.0"
          os: ubuntu-24.04-arm
        - zig: "0.16.0"
          os: windows-latest

    runs-on: ${{ matrix.os }}
      
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src test bench
      - run: zig build test --summary all

  # The two checks that need a real face, on one job so they run once.
  # A missing font FAILS here rather than letting the fuzz sweep skip quietly.
  with-a-font:
    runs-on: ubuntu-latest

    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: zig build fuzz -Dfont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --summary all
      - run: zig build bench -Doptimize=ReleaseFast -Dfont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
